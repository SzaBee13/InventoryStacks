name: InventoryStacks
version: ${version}
api-version: 1.13
main: me.szabee.inventorystacks.InventoryStacks
authors: [CodingGuru, SzaBee13]
softdepend: [WorldGuard]
folia-supported: true
commands:
    stack:
     description: Stack all items in your inventory.
    stacks:
     description: Reload inventory stacks.
    inventorystacks:
     description: Reload inventory stacks.
permissions:
    STACKS.*:
     description: Grants all InventoryStacks permissions
     default: op
    STACKS.COMMAND:
     description: Allows use of the /stack command
     default: op
    STACKS.RELOAD:
     description: Allows use of /stacks reload
     default: op
    STACKS.USE:
     description: Allows the player to benefit from custom stack sizes
     default: true
    STACKS.SIZE.*:
     description: Wildcard for all STACKS.SIZE permissions
     default: op
